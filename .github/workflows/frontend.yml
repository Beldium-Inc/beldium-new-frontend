name: Frontend checks

# Runs on every pull request and on every push to main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Install, lint, type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Required. The build fails if this is empty, so it never falls back to localhost.
      # Set it as a repository variable named VITE_API_URL.
      VITE_API_URL: ${{ vars.VITE_API_URL }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build
